<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery</title>
    <style>
        body { font-family: Arial, sans-serif; }
        .gallery { display: flex; flex-wrap: wrap; gap: 10px; }
        .gallery img { width: 200px; height: auto; border: 2px solid #ccc; }
    </style>
</head>
<body>
    <h1>Photo Gallery</h1>
    <div class="gallery">
        <img src="path/to/photo1.jpg" alt="Photo 1">
        <img src="path/to/photo2.jpg" alt="Photo 2">
        <img src="path/to/photo3.jpg" alt="Photo 3">
        <img src="path/to/photo4.jpg" alt="Photo 4">
    </div>
    <h2>Activities</h2>
    <ul>
        <li>Activity 1: Description of activity 1.</li>
        <li>Activity 2: Description of activity 2.</li>
        <li>Activity 3: Description of activity 3.</li>
    </ul>
</body>
</html>
